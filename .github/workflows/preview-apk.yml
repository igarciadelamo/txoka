name: Preview APK

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}-${{ (github.event.label.name && github.event.label.name != 'build-apk') && github.run_id || 'candidate' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  eligibility:
    if: >-
      github.repository == 'igarciadelamo/txoka' &&
      github.event.pull_request.state == 'open' &&
      (!github.event.label.name || github.event.label.name == 'build-apk') &&
      contains(github.event.pull_request.labels.*.name, 'build-apk')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Check changed files for this event
        id: paths
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_ACTION: ${{ github.event.action }}
        run: python3 scripts/ci/preview_changes.py
      - name: Check the current label and source commit
        if: steps.paths.outputs.relevant == 'true'
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/preview_apk.py gate --pr "$PREVIEW_PR" --sha "$PREVIEW_SHA"

  build:
    name: Build and verify preview
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false
      - name: Install the project's Android SDK packages
        run: |
          sdkmanager 'cmdline-tools;23.0'
          "$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Set up Gradle without exporting PR caches
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Verify the workflow policies
        run: python3 -m unittest discover -s scripts/ci/tests -p 'test_preview*.py' -v
      - name: Build, test and lint the exact source commit
        run: >-
          ./gradlew :app:assembleDebug :app:assembleRelease :app:assemblePreview
          :app:testDebugUnitTest :app:testPreviewUnitTest :app:koverVerifyDebug
          detekt ktlintCheck :app:lintDebug :app:lintRelease :app:lintPreview
      - name: Validate and package the unsigned candidate
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci/preview_apk.py candidate
          --pr "$PREVIEW_PR" --sha "$PREVIEW_SHA"
          --apk app/build/outputs/apk/preview/app-preview-unsigned.apk
          --build-tools "$ANDROID_HOME/build-tools/37.0.0"
          --output preview-unsigned
      - name: Upload the unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            preview-unsigned/preview.apk
            preview-unsigned/source.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-build-reports-${{ github.run_id }}-a${{ github.run_attempt }}
          path: app/build/reports/**
          retention-days: 14

  instrumentation:
    name: Device persistence tests
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false
      - name: Install the project's Android SDK packages
        run: |
          sdkmanager 'cmdline-tools;23.0'
          "$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Set up Gradle without exporting PR caches
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Enable hardware acceleration on the disposable runner
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Run the instrumented tests on a fresh Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-build: "15004761" # Emulator 36.4.10
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -feature -Vulkan
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-device-tests-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 14
