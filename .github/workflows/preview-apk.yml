name: Preview APK

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]

concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  eligibility:
    if: >-
      github.repository == 'igarciadelamo/txoka' &&
      github.event.pull_request.state == 'open' &&
      contains(github.event.pull_request.labels.*.name, 'build-apk')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.gate.outputs.eligible }}
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check the current label and source commit
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/preview_apk.py gate --pr "$PREVIEW_PR" --sha "$PREVIEW_SHA"

  build:
    name: Build and verify preview
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false
      - name: Install the project's Android SDK packages
        run: |
          sdkmanager 'cmdline-tools;23.0'
          "$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Set up Gradle without exporting PR caches
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Verify the workflow policies
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Build, test and lint the exact source commit
        run: >-
          ./gradlew :app:assembleDebug :app:assembleRelease :app:assemblePreview
          :app:testDebugUnitTest :app:testPreviewUnitTest :app:koverVerifyDebug
          detekt ktlintCheck :app:lintDebug :app:lintRelease :app:lintPreview
      - name: Validate and package the unsigned candidate
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_PR: ${{ github.event.pull_request.number }}
          PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci/preview_apk.py candidate
          --pr "$PREVIEW_PR" --sha "$PREVIEW_SHA"
          --apk app/build/outputs/apk/preview/app-preview-unsigned.apk
          --build-tools "$ANDROID_HOME/build-tools/37.0.0"
          --output preview-unsigned
      - name: Upload the unsigned candidate
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: |
            preview-unsigned/preview.apk
            preview-unsigned/source.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-build-reports-${{ github.run_id }}-a${{ github.run_attempt }}
          path: app/build/reports/**
          retention-days: 14

  source-security:
    name: Kotlin and secret scanning
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install the pinned source scanner
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --disable-pip-version-check 'semgrep==1.182.0'
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
      - name: Scan Kotlin and audit source coverage
        run: |
          python3 -m unittest discover -s scripts/ci/tests -p test_source_security_rules.py -v
          python3 scripts/ci/source_security.py --output-dir security-reports/source
      - name: Upload source security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-source-security-${{ github.run_id }}-a${{ github.run_attempt }}
          path: security-reports/source/**
          retention-days: 14

  dependency-security:
    name: Runtime dependency vulnerabilities
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false
      - name: Install the project's Android SDK packages
        run: |
          sdkmanager 'cmdline-tools;23.0'
          "$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Set up Gradle without exporting PR caches
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Export the complete preview runtime inventory
        run: ./gradlew --no-configuration-cache -I scripts/ci/dependencies.init.gradle :app:writePreviewSbom
      - name: Scan the runtime SBOM
        run: >-
          python3 scripts/ci/dependency_security.py
          --sbom app/build/reports/security/preview-sbom.cdx.json
          --output-dir security-reports/dependencies
      - name: Upload the SBOM and vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-dependency-security-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            app/build/reports/security/preview-sbom.cdx.json
            security-reports/dependencies/**
          retention-days: 14

  apk-security:
    name: APK analysis with MobSF
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Download only this run's candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: candidate
          merge-multiple: true
      - name: Analyze the candidate in an ephemeral local scanner
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/ci/apk_security.py candidate/preview.apk
          --output-dir security-reports/apk
      - name: Upload the APK security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-apk-security-${{ github.run_id }}-a${{ github.run_attempt }}
          path: security-reports/apk/**
          retention-days: 14

  instrumentation:
    name: Device persistence tests
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the requested source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false
      - name: Install the project's Android SDK packages
        run: |
          sdkmanager 'cmdline-tools;23.0'
          "$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Set up Gradle without exporting PR caches
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Enable hardware acceleration on the disposable runner
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Run DAO and migration tests on a fresh Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-device-tests-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 14
