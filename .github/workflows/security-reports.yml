name: Dependency security

on:
  schedule:
    - cron: '23 6 * * 1'
  pull_request:
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/security-reports.yml'
      - 'scripts/ci/dependency_security.py'
      - 'scripts/ci/tests/test_dependency_security.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-security:
    name: Runtime dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the source to scan
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false
      - name: Install the project's Android SDK packages
        run: |
          sdkmanager 'cmdline-tools;23.0'
          "$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Set up Gradle without exporting PR caches
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Export the complete preview runtime inventory
        run: ./gradlew --no-configuration-cache -I scripts/ci/dependencies.init.gradle :app:writePreviewSbom
      - name: Scan the runtime SBOM
        run: >-
          python3 scripts/ci/dependency_security.py
          --sbom app/build/reports/security/preview-sbom.cdx.json
          --output-dir security-reports/dependencies
      - name: Upload the SBOM and vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-dependency-security-${{ github.run_id }}-a${{ github.run_attempt }}
          path: |
            app/build/reports/security/preview-sbom.cdx.json
            security-reports/dependencies/**
          retention-days: 14
