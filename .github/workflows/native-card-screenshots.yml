name: Native card review screenshots

on:
  push:
    branches: [qa/native-material-qr-review]

permissions:
  contents: read

env:
  APP_SOURCE_SHA: "dd9c3a58464373776391f27a49dc8a3abc522a93"

concurrency:
  group: native-card-review
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture the actual Android card editor
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the review source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the reviewed app source
        run: |
          test "${#APP_SOURCE_SHA}" -eq 40
          git fetch --no-tags --depth=1 origin "$APP_SOURCE_SHA"
          git diff --exit-code "$APP_SOURCE_SHA" -- app/src/main app/src/test app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties gradle
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up the Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false
      - name: Install the project SDK packages
        run: |
          sdkmanager 'cmdline-tools;23.0'
          "$ANDROID_HOME/cmdline-tools/23.0/bin/sdkmanager" 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true
      - name: Build the native feature APK
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          ./gradlew --stop
      - name: Enable runner acceleration
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Capture native app screens in a fresh emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-build: "15004761" # Stable emulator 36.4.10
          disable-animations: true
          force-avd-creation: true
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim -camera-back none -memory 4096 -cores 2 -feature -Vulkan
          script: python3 scripts/qa/native_card_screenshots.py
      - name: Upload actual screenshots and capture metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-card-review-${{ github.run_id }}-a${{ github.run_attempt }}
          path: screenshot-review/**
          if-no-files-found: error
          retention-days: 7
