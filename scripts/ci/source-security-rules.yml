rules:
  - id: txoka-native-weak-cipher
    languages: [kotlin, java]
    message: Review obsolete or unauthenticated encryption; prefer authenticated modern encryption.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: Cipher.getInstance($ALGORITHM, ...)
          - pattern: javax.crypto.Cipher.getInstance($ALGORITHM, ...)
      - metavariable-regex:
          metavariable: $ALGORITHM
          regex: '(?i)"(?:DES|DESede|RC2|RC4|ARCFOUR|AES(?:/ECB(?:/[^\"]+)?)?)"'
  - id: txoka-native-weak-digest
    languages: [kotlin, java]
    message: MD5 and SHA-1 are unsuitable for security-sensitive integrity or password protection.
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGORITHM, ...)
          - pattern: java.security.MessageDigest.getInstance($ALGORITHM, ...)
      - metavariable-regex:
          metavariable: $ALGORITHM
          regex: '(?i)"(?:MD5|SHA-?1)"'
  - id: txoka-native-unchecked-command-execution
    languages: [kotlin, java]
    message: Review external command execution and ensure contact/NFC data cannot reach shell commands.
    severity: WARNING
    pattern-either:
      - pattern: Runtime.getRuntime().exec(...)
      - pattern: java.lang.Runtime.getRuntime().exec(...)
      - pattern: ProcessBuilder(...)
  - id: txoka-native-javascript-bridge
    languages: [kotlin, java]
    message: A WebView JavaScript bridge exposes native methods; review the origin and accessible methods.
    severity: WARNING
    pattern: $WEBVIEW.addJavascriptInterface(...)
  - id: txoka-native-unprotected-file-uri
    languages: [kotlin, java]
    message: Do not expose private app files through raw file URIs; use a scoped FileProvider when sharing.
    severity: WARNING
    pattern-either:
      - pattern: Uri.fromFile(...)
      - pattern: android.net.Uri.fromFile(...)
  - id: txoka-native-xml-parser-defaults
    languages: [kotlin, java]
    message: Review external entity and DTD settings before passing untrusted XML to this parser.
    severity: INFO
    pattern-either:
      - pattern: DocumentBuilderFactory.newInstance(...)
      - pattern: SAXParserFactory.newInstance(...)
  - id: txoka-embedded-private-key
    languages: [generic]
    message: A private-key header may indicate embedded signing or service credentials.
    severity: ERROR
    pattern-regex: '-----BEGIN (?:RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----'
  - id: txoka-embedded-github-token
    languages: [generic]
    message: A GitHub token may be embedded in the application source; revoke it and remove it.
    severity: ERROR
    pattern-regex: '(?:gh[pousr]_[A-Za-z0-9]{36,255}|github_pat_[A-Za-z0-9_]{60,255})'
