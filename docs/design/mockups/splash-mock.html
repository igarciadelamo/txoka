<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E9E5DF;font-family:Manrope,system-ui,sans-serif;padding:34px 36px 40px;width:1360px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.4px;color:#171614}
  p.sub{font-size:13px;color:#5F5C56;margin-top:5px;font-weight:600}
  .row{display:flex;gap:34px;margin-top:30px}
  figure{display:flex;flex-direction:column;align-items:center;gap:12px}
  figcaption{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#5F5C56}
  .phone{width:390px;height:760px;border-radius:34px;overflow:hidden;position:relative;
    box-shadow:0 26px 60px -34px rgba(23,22,20,.6)}
  .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .grad{background:
    radial-gradient(120% 90% at 12% 0%, rgba(255,255,255,.28), rgba(255,255,255,0) 55%),
    linear-gradient(150deg,#4F46E5 0%,#3B82F6 48%,#06B6D4 100%)}
  .canvas{background:#F7F5F2}
  .name{font-size:36px;font-weight:800;letter-spacing:-1.2px;color:#fff;margin-top:22px}
  .tagline{font-size:14px;font-weight:500;color:rgba(255,255,255,.78);margin-top:8px}
  .canvas .name{color:#171614}
  .canvas .tagline{color:#5F5C56}
  .tile{width:96px;height:96px;border-radius:26px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#4F46E5,#06B6D4);box-shadow:0 18px 34px -18px rgba(79,70,229,.85)}
  .tile.ghost{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);box-shadow:none}
  .foot{position:absolute;bottom:44px;left:0;right:0;text-align:center;font-size:12px;font-weight:600;
    color:rgba(255,255,255,.6)}
  .canvas .foot{color:#8E8A83}
</style>
</head>
<body>
  <h1>Txoka · Splash options</h1>
  <p class="sub">Android 12+ system splash only shows icon + background. Anything below is our own branded screen right after it.</p>
  <div class="row">

    <figure>
      <div class="phone grad">
        <div class="center">
          <div class="tile ghost">
            <svg width="62" height="62" viewBox="0 0 64 64" fill="none">
              <rect x="6" y="14" width="42" height="28" rx="7" fill="#fff" opacity=".95" transform="rotate(-8 6 14)"/>
              <circle cx="21" cy="27" r="5.5" fill="#4F46E5" opacity=".85"/>
              <rect x="30" y="25" width="12" height="3" rx="1.5" fill="#4F46E5" opacity=".65"/>
              <rect x="30" y="31" width="8" height="3" rx="1.5" fill="#06B6D4"/>
              <circle cx="50" cy="45" r="2.6" fill="#fff"/>
              <path d="M55 40a8 8 0 0 1 0 10M59 36a13 13 0 0 1 0 18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="name">Txoka</div>
        </div>
      </div>
      <figcaption>A · Gradient brand splash</figcaption>
    </figure>

    <figure>
      <div class="phone canvas">
        <div class="center">
          <div class="tile">
            <svg width="62" height="62" viewBox="0 0 64 64" fill="none">
              <rect x="6" y="14" width="42" height="28" rx="7" fill="#fff" opacity=".95" transform="rotate(-8 6 14)"/>
              <circle cx="21" cy="27" r="5.5" fill="#4F46E5" opacity=".85"/>
              <rect x="30" y="25" width="12" height="3" rx="1.5" fill="#4F46E5" opacity=".65"/>
              <rect x="30" y="31" width="8" height="3" rx="1.5" fill="#06B6D4"/>
              <circle cx="50" cy="45" r="2.6" fill="#4F46E5"/>
              <path d="M55 40a8 8 0 0 1 0 10M59 36a13 13 0 0 1 0 18" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="name">Txoka</div>
        </div>
      </div>
      <figcaption>B · Canvas splash, brand tile</figcaption>
    </figure>

    <figure>
      <div class="phone grad">
        <div class="center">
          <div class="tile ghost">
            <svg width="62" height="62" viewBox="0 0 64 64" fill="none">
              <rect x="6" y="14" width="42" height="28" rx="7" fill="#fff" opacity=".95" transform="rotate(-8 6 14)"/>
              <circle cx="21" cy="27" r="5.5" fill="#4F46E5" opacity=".85"/>
              <rect x="30" y="25" width="12" height="3" rx="1.5" fill="#4F46E5" opacity=".65"/>
              <rect x="30" y="31" width="8" height="3" rx="1.5" fill="#06B6D4"/>
              <circle cx="50" cy="45" r="2.6" fill="#fff"/>
              <path d="M55 40a8 8 0 0 1 0 10M59 36a13 13 0 0 1 0 18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
        </div>
      </div>
      <figcaption>C · Today (icon only, 2 s)</figcaption>
    </figure>

  </div>
</body>
</html>
