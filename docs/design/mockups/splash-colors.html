<style>
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:#E9E5DF;font-family:Manrope,sans-serif;padding:30px 34px;width:1340px}

 p.s{font-size:13px;color:#5F5C56;font-weight:600;margin-top:4px}

 .phone{width:300px;height:640px;border-radius:30px;overflow:hidden;position:relative;

 .circle{width:150px;height:150px;border-radius:50%;
   background:radial-gradient(120% 120% at 15% 0%, rgba(255,255,255,.28), rgba(255,255,255,0) 55%),
   linear-gradient(135deg,#4F46E5,#3E7BE8 55%,#06B6D4);
   display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -22px rgba(79,70,229,.8)}
 .word{position:absolute;bottom:64px;font-size:34px;font-weight:800;letter-spacing:-1.2px}
 .a{background:#F1EFFC} .a .word{color:#171614}
 .b{background:#DCD6F7} .b .word{color:#171614}
 .c{background:#4F46E5} .c .word{color:#fff}
 .d{background:#1B1740} .d .word{color:#F4F1EC}
