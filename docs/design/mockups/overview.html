<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#E9E5DF;font-family:Manrope,system-ui,sans-serif;padding:28px 32px 36px;width:1180px}
  h1{font-size:22px;font-weight:800;letter-spacing:-.4px;color:#171614}
  p{font-size:13px;color:#5F5C56;margin-top:4px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:26px}
  figure{display:flex;flex-direction:column;gap:10px;align-items:center}
  img{width:100%;border-radius:22px;box-shadow:0 18px 40px -24px rgba(23,22,20,.55);background:#F7F5F2}
  figcaption{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:#5F5C56}
</style>
</head>
<body>
  <h1>Txoka · Direction A — Editorial</h1>
  <p>Warm canvas, Manrope titles, card as the only strong colour, grouped surfaces.</p>
  <div class="grid">
    <figure><img src="mock-hub.jpg"><figcaption>Hub</figcaption></figure>
    <figure><img src="mock-empty.jpg"><figcaption>Hub · empty</figcaption></figure>
    <figure><img src="mock-editor.jpg"><figcaption>Editor</figcaption></figure>
    <figure><img src="mock-list.jpg"><figcaption>Received</figcaption></figure>
    <figure><img src="mock-detail.jpg"><figcaption>Detail</figcaption></figure>
    <figure><img src="mock-sheet.jpg"><figcaption>Incoming card</figcaption></figure>
    <figure><img src="mock-settings.jpg"><figcaption>Settings</figcaption></figure>
    <figure><img src="mock-dark.jpg"><figcaption>Hub · dark</figcaption></figure>
  </div>
</body>
</html>
